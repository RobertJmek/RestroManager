services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: restromanager-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Volumele te ajută să lucrezi (Live Reload). Dacă joi schimbi ceva 
    # dintr-un fișier local din backend/, containerul își dă update instant
    volumes:
      - ./backend:/app/backend
    # Suprascriem comanda ca în dev mode să avem acel hot-reload activat 
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
