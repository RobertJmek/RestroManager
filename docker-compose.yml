services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: restromanager-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
    # Volumele te ajută să lucrezi (Live Reload). Dacă joi schimbi ceva 
    # dintr-un fișier local din backend/, containerul își dă update instant
    volumes:
      - ./backend:/app/backend
    # Suprascriem comanda ca în dev mode să avem acel hot-reload activat 
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: restromanager-frontend
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - HOSTNAME=0.0.0.0
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: npm run dev
    restart: unless-stopped
    depends_on:
      - backend
